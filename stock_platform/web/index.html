<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>股票 K 线</title>
  <script src="https://unpkg.com/lightweight-charts@5.0.9/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #131722;
      color: #d1d4dc;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      background: #1e222d;
      border-bottom: 1px solid #2a2e39;
      flex-wrap: wrap;
      position: relative;
    }
    input, button, select {
      background: #2a2e39;
      color: #d1d4dc;
      border: 1px solid #363a45;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 14px;
    }
    button { cursor: pointer; }
    button:hover { background: #363a45; }
    #chart-container {
      flex: 1;
      min-height: 0;
      position: relative;
    }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 16px;
      font-size: 13px;
      color: #787b86;
      background: #1e222d;
      border-top: 1px solid #2a2e39;
    }
    #status { flex: 1; min-width: 0; }
    #status.error { color: #ef5350; }
    #status.warn { color: #f0b90b; }
    .tv-credit {
      color: #787b86;
      text-decoration: none;
      white-space: nowrap;
    }
    .tv-credit:hover { color: #d1d4dc; }
    .suggestions {
      position: absolute;
      top: 100%;
      left: 16px;
      z-index: 10;
      background: #2a2e39;
      border: 1px solid #363a45;
      border-radius: 4px;
      min-width: 280px;
      max-height: 240px;
      overflow: auto;
      display: none;
    }
    .suggestions div {
      padding: 8px 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .suggestions div:hover { background: #363a45; }
  </style>
</head>
<body>
  <div class="toolbar">
    <input id="code-input" type="text" placeholder="输入代码，如 000001.SZ" value="000001.SZ" autocomplete="off" />
    <input id="start-input" type="date" />
    <input id="end-input" type="date" />
    <select id="range-select">
      <option value="">全部</option>
      <option value="1">近 1 年</option>
      <option value="3">近 3 年</option>
      <option value="5">近 5 年</option>
    </select>
    <button id="load-btn">加载</button>
    <button id="reset-btn" title="恢复纵向自适应并铺满时间轴">重置视图</button>
    <div id="suggestions" class="suggestions"></div>
  </div>

  <div id="chart-container"></div>
  <div class="footer">
    <div id="status">就绪</div>
    <!-- 关闭图表内 logo 后，按 Lightweight Charts 许可在此保留署名链接 -->
    <a class="tv-credit" href="https://www.tradingview.com/" target="_blank" rel="noopener">Charts by TradingView</a>
  </div>

  <script>
    const chartContainer = document.getElementById("chart-container");
    const statusEl = document.getElementById("status");
    const codeInput = document.getElementById("code-input");
    const startInput = document.getElementById("start-input");
    const endInput = document.getElementById("end-input");
    const rangeSelect = document.getElementById("range-select");
    const suggestionsEl = document.getElementById("suggestions");

    const MAX_SUGGESTIONS = 50;

    const CANDLE_PANE = 0;
    const VOLUME_PANE = 1;

    const chart = LightweightCharts.createChart(chartContainer, {
      layout: {
        background: { color: "#131722" },
        textColor: "#d1d4dc",
        // 关闭图表角落的 TV logo（许可要求另在页面保留 TradingView 链接）
        attributionLogo: false,
        // 两块画板之间的分隔条，可以拖动改变上下高度
        panes: {
          separatorColor: "#363a45",
          separatorHoverColor: "#4a4f5c",
          enableResize: true,
        },
      },
      grid: {
        vertLines: { color: "#2a2e39" },
        horzLines: { color: "#2a2e39" },
      },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      rightPriceScale: { borderColor: "#2a2e39" },
      timeScale: { borderColor: "#2a2e39" },
      // 在右侧价格轴上按住拖动即可拉伸纵向刻度，双击还原
      handleScale: {
        axisPressedMouseMove: { price: true, time: true },
        axisDoubleClickReset: { price: true, time: true },
        mouseWheel: true,
        pinch: true,
      },
    });

    // Lightweight Charts v5: addCandlestickSeries 已移除，改用 addSeries。
    // 第三个参数是画板序号：K 线和成交量各占一块，不再相互重叠。
    const candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
      upColor: "#ef5350",
      downColor: "#26a69a",
      borderVisible: false,
      wickUpColor: "#ef5350",
      wickDownColor: "#26a69a",
    }, CANDLE_PANE);

    const volumeSeries = chart.addSeries(LightweightCharts.HistogramSeries, {
      priceFormat: { type: "volume" },
    }, VOLUME_PANE);

    // 用伸缩比而不是固定像素，窗口大小变化时两块画板按比例分配
    chart.panes()[CANDLE_PANE].setStretchFactor(3);
    chart.panes()[VOLUME_PANE].setStretchFactor(1);

    const paneSeries = { [CANDLE_PANE]: candleSeries, [VOLUME_PANE]: volumeSeries };

    function resizeChart() {
      chart.applyOptions({
        width: chartContainer.clientWidth,
        height: chartContainer.clientHeight,
      });
    }
    window.addEventListener("resize", resizeChart);

    function autoScaleAll(on) {
      for (const series of Object.values(paneSeries)) {
        series.priceScale().setAutoScale(on);
      }
    }

    const SEPARATOR_HEIGHT = 1;

    /** 鼠标落在哪块画板上；落在价格轴、时间轴或分隔条上时返回 null。 */
    function paneAt(event) {
      if (event.target.tagName !== "CANVAS") return null;  // 分隔条不是 canvas
      const rect = chartContainer.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      // 右侧价格轴留给库自己处理拉伸，不要拦截
      const axisWidth = candleSeries.priceScale().width();
      if (x > rect.width - axisWidth) return null;

      let top = 0;
      for (const pane of chart.panes()) {
        const height = pane.getHeight();
        if (y >= top && y < top + height) return pane.paneIndex();
        top += height + SEPARATOR_HEIGHT;
      }
      return null;  // 底部时间轴
    }

    // 纵向拖动：库本身只处理横向时间平移，纵向平移要自己接管。
    // 两者共存，于是按住拖动可以同时左右移动时间、上下移动价格。
    let vertDrag = null;

    chartContainer.addEventListener("mousedown", (e) => {
      if (e.button !== 0) return;
      const paneIndex = paneAt(e);
      if (paneIndex === null) return;
      const series = paneSeries[paneIndex];
      if (!series) return;
      vertDrag = { y: e.clientY, series, moved: false };
    });

    window.addEventListener("mousemove", (e) => {
      if (!vertDrag) return;
      const dy = e.clientY - vertDrag.y;
      if (dy === 0) return;

      const scale = vertDrag.series.priceScale();
      if (!vertDrag.moved) {
        // 一旦手动平移就关掉自动缩放，否则每帧都会被拉回数据范围
        scale.setAutoScale(false);
        vertDrag.moved = true;
      }
      const range = scale.getVisibleRange();
      if (!range) return;

      // 用同一根轴上相邻两点的价格差换算“每像素多少价格”，
      // 这样对任意刻度和边距都成立
      const perPixel = vertDrag.series.coordinateToPrice(0) - vertDrag.series.coordinateToPrice(1);
      if (!isFinite(perPixel)) return;

      const shift = dy * perPixel;
      scale.setVisibleRange({ from: range.from + shift, to: range.to + shift });
      vertDrag.y = e.clientY;
    });

    window.addEventListener("mouseup", () => {
      vertDrag = null;
    });

    function setStatus(text, kind = "") {
      statusEl.textContent = text;
      statusEl.className = kind;
    }

    async function readError(resp) {
      try {
        const body = await resp.json();
        return body.detail || `HTTP ${resp.status}`;
      } catch {
        return `HTTP ${resp.status}`;
      }
    }

    // 预设区间交给后端按该股票最后交易日计算。
    // 若在前端用“今天”做基准，历史数据库永远查不到数据。
    function buildParams(code) {
      const params = new URLSearchParams({ code });
      const years = rangeSelect.value;
      if (years) {
        params.set("years", years);
      } else {
        if (startInput.value) params.set("start", startInput.value);
        if (endInput.value) params.set("end", endInput.value);
      }
      return params;
    }

    let klineRequestId = 0;
    let loadedCode = null;

    async function loadKline() {
      const code = codeInput.value.trim();
      if (!code) return;

      // 换股票时清掉日期框：上一只的区间未必落在这一只的数据范围内，
      // 沿用会直接查不到数据。
      if (loadedCode !== null && code !== loadedCode) {
        startInput.value = "";
        endInput.value = "";
      }

      const requestId = ++klineRequestId;
      setStatus(`加载中: ${code} ...`);
      try {
        const resp = await fetch(`/api/kline?${buildParams(code)}`);
        if (requestId !== klineRequestId) return;  // 已有更新的请求，丢弃这次结果
        if (!resp.ok) throw new Error(await readError(resp));

        const data = await resp.json();
        if (requestId !== klineRequestId) return;

        candleSeries.setData(data.bars);
        volumeSeries.setData(data.volumes);
        // 换了数据就恢复纵向自适应，否则会沿用上一只股票的价格区间
        autoScaleAll(true);
        chart.timeScale().fitContent();

        loadedCode = code;
        startInput.value = data.start;
        endInput.value = data.end;

        const notes = [];
        if (data.truncated) notes.push(`数据过多已截断，仅显示最近 ${data.count} 根`);
        if (data.skipped) notes.push(`跳过 ${data.skipped} 个无行情的交易日`);
        const range = `${data.code} | ${data.start} ~ ${data.end} | ${data.count} 根 K 线`;
        const available = `（可用区间 ${data.first_available} ~ ${data.last_available}）`;
        setStatus(
          notes.length ? `${range} ${available} — ${notes.join("；")}` : `${range} ${available}`,
          notes.length ? "warn" : ""
        );
      } catch (err) {
        if (requestId !== klineRequestId) return;
        setStatus(`错误: ${err.message}`, "error");
      }
    }

    function renderSuggestions(items) {
      suggestionsEl.textContent = "";
      if (!items.length) {
        suggestionsEl.style.display = "none";
        return;
      }
      for (const item of items) {
        const row = document.createElement("div");
        // 用 textContent 而不是拼 HTML，代码里的特殊字符不会破坏结构
        row.textContent = `${item.code}  (${item.first_date} ~ ${item.last_date}, ${item.bar_count} 根)`;
        row.addEventListener("click", () => {
          codeInput.value = item.code;
          suggestionsEl.style.display = "none";
          loadKline();
        });
        suggestionsEl.appendChild(row);
      }
      suggestionsEl.style.display = "block";
    }

    let searchRequestId = 0;

    async function searchCodes(keyword) {
      if (!keyword) {
        suggestionsEl.style.display = "none";
        return;
      }
      const requestId = ++searchRequestId;
      try {
        const resp = await fetch(
          `/api/instruments?q=${encodeURIComponent(keyword)}&limit=${MAX_SUGGESTIONS}`
        );
        // 先发的请求可能后到，只认最新一次的结果
        if (requestId !== searchRequestId) return;
        if (!resp.ok) throw new Error(await readError(resp));
        const items = await resp.json();
        if (requestId !== searchRequestId) return;
        renderSuggestions(items);
      } catch (err) {
        if (requestId === searchRequestId) suggestionsEl.style.display = "none";
      }
    }

    function debounce(fn, wait) {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), wait);
      };
    }

    // 每敲一个字符都查一次会让服务端对全表反复聚合，这里等用户停手再查
    const debouncedSearch = debounce(searchCodes, 250);

    document.getElementById("load-btn").addEventListener("click", loadKline);
    document.getElementById("reset-btn").addEventListener("click", () => {
      autoScaleAll(true);
      chart.timeScale().fitContent();
    });
    codeInput.addEventListener("input", (e) => debouncedSearch(e.target.value.trim()));
    codeInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        suggestionsEl.style.display = "none";
        loadKline();
      }
    });
    rangeSelect.addEventListener("change", () => {
      // 上一次加载会把区间回填到日期框，不清掉的话选“全部”仍会沿用那个窄区间
      startInput.value = "";
      endInput.value = "";
      loadKline();
    });
    document.addEventListener("click", (e) => {
      if (!suggestionsEl.contains(e.target) && e.target !== codeInput) {
        suggestionsEl.style.display = "none";
      }
    });

    resizeChart();
    loadKline();
  </script>
</body>
</html>
