<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>股票 K 线</title>
  <script src="https://unpkg.com/lightweight-charts@5.0.9/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #131722;
      color: #d1d4dc;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      background: #1e222d;
      border-bottom: 1px solid #2a2e39;
      flex-wrap: wrap;
    }
    input, button, select {
      background: #2a2e39;
      color: #d1d4dc;
      border: 1px solid #363a45;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 14px;
    }
    button { cursor: pointer; }
    button:hover { background: #363a45; }
    #chart-container {
      flex: 1;
      min-height: 0;
      position: relative;
    }
    #status {
      padding: 8px 16px;
      font-size: 13px;
      color: #787b86;
      background: #1e222d;
      border-top: 1px solid #2a2e39;
    }
    .suggestions {
      position: absolute;
      top: 56px;
      left: 16px;
      z-index: 10;
      background: #2a2e39;
      border: 1px solid #363a45;
      border-radius: 4px;
      min-width: 260px;
      max-height: 240px;
      overflow: auto;
      display: none;
    }
    .suggestions div {
      padding: 8px 12px;
      cursor: pointer;
    }
    .suggestions div:hover { background: #363a45; }
  </style>
</head>
<body>
  <div class="toolbar">
    <input id="code-input" type="text" placeholder="输入代码，如 000001.SZ" value="000001.SZ" />
    <input id="start-input" type="date" />
    <input id="end-input" type="date" />
    <select id="range-select">
      <option value="">全部</option>
      <option value="1y">近 1 年</option>
      <option value="3y">近 3 年</option>
      <option value="5y">近 5 年</option>
    </select>
    <button id="load-btn">加载</button>
  </div>

  <div id="chart-container"></div>
  <div id="status">就绪</div>
  <div id="suggestions" class="suggestions"></div>

  <script>
    const chartContainer = document.getElementById("chart-container");
    const statusEl = document.getElementById("status");
    const codeInput = document.getElementById("code-input");
    const startInput = document.getElementById("start-input");
    const endInput = document.getElementById("end-input");
    const rangeSelect = document.getElementById("range-select");
    const suggestionsEl = document.getElementById("suggestions");

    const chart = LightweightCharts.createChart(chartContainer, {
      layout: {
        background: { color: "#131722" },
        textColor: "#d1d4dc",
      },
      grid: {
        vertLines: { color: "#2a2e39" },
        horzLines: { color: "#2a2e39" },
      },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      rightPriceScale: { borderColor: "#2a2e39" },
      timeScale: { borderColor: "#2a2e39" },
    });

    // Lightweight Charts v5: addCandlestickSeries 已移除，改用 addSeries
    const candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
      upColor: "#ef5350",
      downColor: "#26a69a",
      borderVisible: false,
      wickUpColor: "#ef5350",
      wickDownColor: "#26a69a",
    });

    const volumeSeries = chart.addSeries(LightweightCharts.HistogramSeries, {
      priceFormat: { type: "volume" },
      priceScaleId: "",
    });
    volumeSeries.priceScale().applyOptions({
      scaleMargins: { top: 0.8, bottom: 0 },
    });

    window.addEventListener("resize", () => {
      chart.applyOptions({
        width: chartContainer.clientWidth,
        height: chartContainer.clientHeight,
      });
    });

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function calcDateRange() {
      const preset = rangeSelect.value;
      const end = endInput.value || new Date().toISOString().slice(0, 10);
      if (!preset) {
        return {
          start: startInput.value || undefined,
          end: endInput.value || undefined,
        };
      }
      const endDate = new Date(end);
      const startDate = new Date(endDate);
      if (preset === "1y") startDate.setFullYear(endDate.getFullYear() - 1);
      if (preset === "3y") startDate.setFullYear(endDate.getFullYear() - 3);
      if (preset === "5y") startDate.setFullYear(endDate.getFullYear() - 5);
      return {
        start: startDate.toISOString().slice(0, 10),
        end: end,
      };
    }

    async function loadKline() {
      const code = codeInput.value.trim();
      if (!code) return;

      const { start, end } = calcDateRange();
      const params = new URLSearchParams({ code });
      if (start) params.set("start", start);
      if (end) params.set("end", end);

      setStatus(`加载中: ${code} ...`);
      try {
        const resp = await fetch(`/api/kline?${params}`);
        if (!resp.ok) {
          const err = await resp.json();
          throw new Error(err.detail || "加载失败");
        }
        const data = await resp.json();
        candleSeries.setData(data.bars);
        volumeSeries.setData(data.volumes);
        chart.timeScale().fitContent();
        setStatus(`${data.code} | ${data.start} ~ ${data.end} | ${data.count} 根 K 线`);
      } catch (err) {
        setStatus(`错误: ${err.message}`);
      }
    }

    async function searchCodes(keyword) {
      if (!keyword) {
        suggestionsEl.style.display = "none";
        return;
      }
      const resp = await fetch(`/api/instruments?q=${encodeURIComponent(keyword)}&limit=10000`);
      const items = await resp.json();
      if (!items.length) {
        suggestionsEl.style.display = "none";
        return;
      }
      suggestionsEl.innerHTML = items.map(item => `
        <div data-code="${item.code}">
          ${item.code} (${item.first_date} ~ ${item.last_date})
        </div>
      `).join("");
      suggestionsEl.style.display = "block";
      suggestionsEl.querySelectorAll("div").forEach(el => {
        el.addEventListener("click", () => {
          codeInput.value = el.dataset.code;
          suggestionsEl.style.display = "none";
          loadKline();
        });
      });
    }

    document.getElementById("load-btn").addEventListener("click", loadKline);
    codeInput.addEventListener("input", (e) => searchCodes(e.target.value.trim()));
    document.addEventListener("click", (e) => {
      if (!suggestionsEl.contains(e.target) && e.target !== codeInput) {
        suggestionsEl.style.display = "none";
      }
    });

    chart.applyOptions({
      width: chartContainer.clientWidth,
      height: chartContainer.clientHeight,
    });
    loadKline();
  </script>
</body>
</html>
