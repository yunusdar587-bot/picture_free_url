<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>股票 K 线</title>
  <script src="https://unpkg.com/lightweight-charts@5.0.9/dist/lightweight-charts.standalone.production.js"></script>
  <script src="/static/drawings.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #131722;
      color: #d1d4dc;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      background: #1e222d;
      border-bottom: 1px solid #2a2e39;
      flex-wrap: wrap;
      position: relative;
    }
    input, button, select {
      background: #2a2e39;
      color: #d1d4dc;
      border: 1px solid #363a45;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 14px;
    }
    button { cursor: pointer; }
    button:hover { background: #363a45; }
    .workspace {
      flex: 1;
      min-height: 0;
      display: flex;
    }
    .sidebar {
      flex: 0 0 46px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 0;
      background: #1e222d;
      border-right: 1px solid #2a2e39;
    }
    .sidebar button {
      width: 34px;
      height: 34px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid transparent;
      color: #b2b5be;
    }
    .sidebar button:hover:not(:disabled) { background: #2a2e39; color: #d1d4dc; }
    .sidebar button.active {
      background: rgba(41, 98, 255, 0.15);
      border-color: #2962ff;
      color: #2962ff;
    }
    .sidebar button:disabled { opacity: 0.35; cursor: default; }
    .sidebar .sep {
      width: 24px;
      height: 1px;
      background: #2a2e39;
      margin: 4px 0;
    }
    #chart-container {
      flex: 1;
      min-width: 0;
      position: relative;
    }
    /* 画线时把光标换成十字，指到已有图形上换成移动 */
    #chart-container.drawing-active canvas { cursor: crosshair !important; }
    #chart-container.drawing-hit canvas { cursor: move !important; }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 16px;
      font-size: 13px;
      color: #787b86;
      background: #1e222d;
      border-top: 1px solid #2a2e39;
    }
    #status { flex: 1; min-width: 0; }
    #status.error { color: #ef5350; }
    #status.warn { color: #f0b90b; }
    .tv-credit {
      color: #787b86;
      text-decoration: none;
      white-space: nowrap;
    }
    .tv-credit:hover { color: #d1d4dc; }
    .suggestions {
      position: absolute;
      top: 100%;
      left: 16px;
      z-index: 10;
      background: #2a2e39;
      border: 1px solid #363a45;
      border-radius: 4px;
      min-width: 280px;
      max-height: 240px;
      overflow: auto;
      display: none;
    }
    .suggestions div {
      padding: 8px 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .suggestions div:hover { background: #363a45; }
  </style>
</head>
<body>
  <div class="toolbar">
    <input id="code-input" type="text" placeholder="输入代码，如 000001.SZ" value="000001.SZ" autocomplete="off" />
    <input id="start-input" type="date" />
    <input id="end-input" type="date" />
    <select id="range-select">
      <option value="">全部</option>
      <option value="1">近 1 年</option>
      <option value="3">近 3 年</option>
      <option value="5">近 5 年</option>
    </select>
    <button id="load-btn">加载</button>
    <button id="reset-btn" title="恢复纵向自适应并铺满时间轴">重置视图</button>
    <div id="suggestions" class="suggestions"></div>
  </div>

  <div class="workspace">
    <div class="sidebar" id="draw-tools">
      <button data-tool="cursor" class="active" title="选择 / 移动图形（Esc）">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M6 3l12 8.2-5.1 1-2.4 5.6z" />
        </svg>
      </button>
      <button data-tool="trendline" title="线段：点两下画一条线">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <line x1="5" y1="19" x2="19" y2="5" />
          <circle cx="5" cy="19" r="2" /><circle cx="19" cy="5" r="2" />
        </svg>
      </button>
      <button data-tool="ray" title="射线：从起点向终点方向无限延伸">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <line x1="4" y1="20" x2="20" y2="4" />
          <circle cx="4" cy="20" r="2" />
          <polyline points="13,4 20,4 20,11" />
        </svg>
      </button>
      <button data-tool="rectangle" title="矩形边框（不填充）">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <rect x="4" y="6" width="16" height="12" rx="1" />
        </svg>
      </button>
      <button data-tool="fib" title="斐波那契回撤：先点起点，再点终点">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <line x1="3" y1="5" x2="21" y2="5" /><line x1="3" y1="10" x2="21" y2="10" />
          <line x1="3" y1="14" x2="21" y2="14" /><line x1="3" y1="19" x2="21" y2="19" />
          <line x1="6" y1="20" x2="18" y2="4" stroke-dasharray="3 3" />
        </svg>
      </button>
      <div class="sep"></div>
      <button id="undo-btn" title="撤销（Ctrl+Z）" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M9 8H15a5 5 0 010 10H8" />
          <polyline points="12,5 9,8 12,11" />
        </svg>
      </button>
      <button id="redo-btn" title="重做（Ctrl+Y）" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M15 8H9a5 5 0 000 10h7" />
          <polyline points="12,5 15,8 12,11" />
        </svg>
      </button>
      <button id="clear-draw-btn" title="清除本股票的全部图形" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12" />
        </svg>
      </button>
    </div>
    <div id="chart-container"></div>
  </div>
  <div class="footer">
    <div id="status">就绪</div>
    <!-- 关闭图表内 logo 后，按 Lightweight Charts 许可在此保留署名链接 -->
    <a class="tv-credit" href="https://www.tradingview.com/" target="_blank" rel="noopener">Charts by TradingView</a>
  </div>

  <script>
    const chartContainer = document.getElementById("chart-container");
    const statusEl = document.getElementById("status");
    const codeInput = document.getElementById("code-input");
    const startInput = document.getElementById("start-input");
    const endInput = document.getElementById("end-input");
    const rangeSelect = document.getElementById("range-select");
    const suggestionsEl = document.getElementById("suggestions");

    const MAX_SUGGESTIONS = 50;

    const CANDLE_PANE = 0;
    const VOLUME_PANE = 1;

    const chart = LightweightCharts.createChart(chartContainer, {
      layout: {
        background: { color: "#131722" },
        textColor: "#d1d4dc",
        // 关闭图表角落的 TV logo（许可要求另在页面保留 TradingView 链接）
        attributionLogo: false,
        // 两块画板之间的分隔条，可以拖动改变上下高度
        panes: {
          separatorColor: "#363a45",
          separatorHoverColor: "#4a4f5c",
          enableResize: true,
        },
      },
      grid: {
        vertLines: { color: "#2a2e39" },
        horzLines: { color: "#2a2e39" },
      },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      rightPriceScale: { borderColor: "#2a2e39" },
      timeScale: { borderColor: "#2a2e39" },
      // 在右侧价格轴上按住拖动即可拉伸纵向刻度，双击还原
      handleScale: {
        axisPressedMouseMove: { price: true, time: true },
        axisDoubleClickReset: { price: true, time: true },
        mouseWheel: true,
        pinch: true,
      },
    });

    // Lightweight Charts v5: addCandlestickSeries 已移除，改用 addSeries。
    // 第三个参数是画板序号：K 线和成交量各占一块，不再相互重叠。
    const candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
      upColor: "#ef5350",
      downColor: "#26a69a",
      borderVisible: false,
      wickUpColor: "#ef5350",
      wickDownColor: "#26a69a",
    }, CANDLE_PANE);

    const volumeSeries = chart.addSeries(LightweightCharts.HistogramSeries, {
      priceFormat: { type: "volume" },
    }, VOLUME_PANE);

    // 用伸缩比而不是固定像素，窗口大小变化时两块画板按比例分配
    chart.panes()[CANDLE_PANE].setStretchFactor(3);
    chart.panes()[VOLUME_PANE].setStretchFactor(1);

    const paneSeries = { [CANDLE_PANE]: candleSeries, [VOLUME_PANE]: volumeSeries };

    function resizeChart() {
      chart.applyOptions({
        width: chartContainer.clientWidth,
        height: chartContainer.clientHeight,
      });
    }
    window.addEventListener("resize", resizeChart);

    function autoScaleAll(on) {
      for (const series of Object.values(paneSeries)) {
        series.priceScale().setAutoScale(on);
      }
    }

    const SEPARATOR_HEIGHT = 1;

    /** 鼠标落在哪块画板上；落在价格轴、时间轴或分隔条上时返回 null。 */
    function paneAt(event) {
      if (event.target.tagName !== "CANVAS") return null;  // 分隔条不是 canvas
      const rect = chartContainer.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      // 右侧价格轴留给库自己处理拉伸，不要拦截
      const axisWidth = candleSeries.priceScale().width();
      if (x > rect.width - axisWidth) return null;

      let top = 0;
      for (const pane of chart.panes()) {
        const height = pane.getHeight();
        if (y >= top && y < top + height) return pane.paneIndex();
        top += height + SEPARATOR_HEIGHT;
      }
      return null;  // 底部时间轴
    }

    // 纵向拖动：库本身只处理横向时间平移，纵向平移要自己接管。
    // 两者共存，于是按住拖动可以同时左右移动时间、上下移动价格。
    let vertDrag = null;

    chartContainer.addEventListener("mousedown", (e) => {
      if (e.button !== 0) return;
      if (drawTools.getTool() !== "cursor") return;  // 画线时不要顺手把价格轴拖走
      const paneIndex = paneAt(e);
      if (paneIndex === null) return;
      const series = paneSeries[paneIndex];
      if (!series) return;
      vertDrag = { y: e.clientY, series, moved: false };
    });

    window.addEventListener("mousemove", (e) => {
      if (!vertDrag) return;
      const dy = e.clientY - vertDrag.y;
      if (dy === 0) return;

      const scale = vertDrag.series.priceScale();
      if (!vertDrag.moved) {
        // 一旦手动平移就关掉自动缩放，否则每帧都会被拉回数据范围
        scale.setAutoScale(false);
        vertDrag.moved = true;
      }
      const range = scale.getVisibleRange();
      if (!range) return;

      // 用同一根轴上相邻两点的价格差换算“每像素多少价格”，
      // 这样对任意刻度和边距都成立
      const perPixel = vertDrag.series.coordinateToPrice(0) - vertDrag.series.coordinateToPrice(1);
      if (!isFinite(perPixel)) return;

      const shift = dy * perPixel;
      scale.setVisibleRange({ from: range.from + shift, to: range.to + shift });
      vertDrag.y = e.clientY;
    });

    window.addEventListener("mouseup", () => {
      vertDrag = null;
    });

    // 画线工具：图形按“K 线 + 价格”存，所以跟着图表一起缩放平移。
    const sidebar = document.getElementById("draw-tools");
    const undoBtn = document.getElementById("undo-btn");
    const redoBtn = document.getElementById("redo-btn");
    const clearDrawBtn = document.getElementById("clear-draw-btn");
    const toolButtons = sidebar.querySelectorAll("button[data-tool]");

    const drawTools = createDrawingTools({
      chart,
      series: candleSeries,
      container: chartContainer,
      paneIndex: CANDLE_PANE,
      onChange: (state) => {
        for (const btn of toolButtons) {
          btn.classList.toggle("active", btn.dataset.tool === state.tool);
        }
        undoBtn.disabled = !state.canUndo;
        redoBtn.disabled = !state.canRedo;
        clearDrawBtn.disabled = state.count === 0;
      },
    });

    for (const btn of toolButtons) {
      btn.addEventListener("click", () => {
        // 再点一次当前工具就退回选择状态
        const next = btn.classList.contains("active") ? "cursor" : btn.dataset.tool;
        drawTools.setTool(next);
      });
    }
    undoBtn.addEventListener("click", () => drawTools.undo());
    redoBtn.addEventListener("click", () => drawTools.redo());
    clearDrawBtn.addEventListener("click", () => drawTools.clearAll());

    function setStatus(text, kind = "") {
      statusEl.textContent = text;
      statusEl.className = kind;
    }

    async function readError(resp) {
      try {
        const body = await resp.json();
        return body.detail || `HTTP ${resp.status}`;
      } catch {
        return `HTTP ${resp.status}`;
      }
    }

    // 预设区间交给后端按该股票最后交易日计算。
    // 若在前端用“今天”做基准，历史数据库永远查不到数据。
    function buildParams(code) {
      const params = new URLSearchParams({ code });
      const years = rangeSelect.value;
      if (years) {
        params.set("years", years);
      } else {
        if (startInput.value) params.set("start", startInput.value);
        if (endInput.value) params.set("end", endInput.value);
      }
      return params;
    }

    let klineRequestId = 0;
    let loadedCode = null;

    async function loadKline() {
      const code = codeInput.value.trim();
      if (!code) return;

      // 换股票时清掉日期框：上一只的区间未必落在这一只的数据范围内，
      // 沿用会直接查不到数据。
      if (loadedCode !== null && code !== loadedCode) {
        startInput.value = "";
        endInput.value = "";
      }

      const requestId = ++klineRequestId;
      setStatus(`加载中: ${code} ...`);
      try {
        const resp = await fetch(`/api/kline?${buildParams(code)}`);
        if (requestId !== klineRequestId) return;  // 已有更新的请求，丢弃这次结果
        if (!resp.ok) throw new Error(await readError(resp));

        const data = await resp.json();
        if (requestId !== klineRequestId) return;

        candleSeries.setData(data.bars);
        volumeSeries.setData(data.volumes);
        // 图形按股票分开存，换回来还在；端点靠日期定位，换区间也不会跑偏
        drawTools.setSymbol(data.code);
        drawTools.setTimes(data.bars.map((bar) => bar.time));
        // 换了数据就恢复纵向自适应，否则会沿用上一只股票的价格区间
        autoScaleAll(true);
        chart.timeScale().fitContent();

        loadedCode = code;
        startInput.value = data.start;
        endInput.value = data.end;

        const notes = [];
        if (data.truncated) notes.push(`数据过多已截断，仅显示最近 ${data.count} 根`);
        if (data.skipped) notes.push(`跳过 ${data.skipped} 个无行情的交易日`);
        const range = `${data.code} | ${data.start} ~ ${data.end} | ${data.count} 根 K 线`;
        const available = `（可用区间 ${data.first_available} ~ ${data.last_available}）`;
        setStatus(
          notes.length ? `${range} ${available} — ${notes.join("；")}` : `${range} ${available}`,
          notes.length ? "warn" : ""
        );
      } catch (err) {
        if (requestId !== klineRequestId) return;
        setStatus(`错误: ${err.message}`, "error");
      }
    }

    function renderSuggestions(items) {
      suggestionsEl.textContent = "";
      if (!items.length) {
        suggestionsEl.style.display = "none";
        return;
      }
      for (const item of items) {
        const row = document.createElement("div");
        // 用 textContent 而不是拼 HTML，代码里的特殊字符不会破坏结构
        row.textContent = `${item.code}  (${item.first_date} ~ ${item.last_date}, ${item.bar_count} 根)`;
        row.addEventListener("click", () => {
          codeInput.value = item.code;
          suggestionsEl.style.display = "none";
          loadKline();
        });
        suggestionsEl.appendChild(row);
      }
      suggestionsEl.style.display = "block";
    }

    let searchRequestId = 0;

    async function searchCodes(keyword) {
      if (!keyword) {
        suggestionsEl.style.display = "none";
        return;
      }
      const requestId = ++searchRequestId;
      try {
        const resp = await fetch(
          `/api/instruments?q=${encodeURIComponent(keyword)}&limit=${MAX_SUGGESTIONS}`
        );
        // 先发的请求可能后到，只认最新一次的结果
        if (requestId !== searchRequestId) return;
        if (!resp.ok) throw new Error(await readError(resp));
        const items = await resp.json();
        if (requestId !== searchRequestId) return;
        renderSuggestions(items);
      } catch (err) {
        if (requestId === searchRequestId) suggestionsEl.style.display = "none";
      }
    }

    function debounce(fn, wait) {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), wait);
      };
    }

    // 每敲一个字符都查一次会让服务端对全表反复聚合，这里等用户停手再查
    const debouncedSearch = debounce(searchCodes, 250);

    document.getElementById("load-btn").addEventListener("click", loadKline);
    document.getElementById("reset-btn").addEventListener("click", () => {
      autoScaleAll(true);
      chart.timeScale().fitContent();
    });
    codeInput.addEventListener("input", (e) => debouncedSearch(e.target.value.trim()));
    codeInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        suggestionsEl.style.display = "none";
        loadKline();
      }
    });
    rangeSelect.addEventListener("change", () => {
      // 上一次加载会把区间回填到日期框，不清掉的话选“全部”仍会沿用那个窄区间
      startInput.value = "";
      endInput.value = "";
      loadKline();
    });
    document.addEventListener("click", (e) => {
      if (!suggestionsEl.contains(e.target) && e.target !== codeInput) {
        suggestionsEl.style.display = "none";
      }
    });

    resizeChart();
    loadKline();
  </script>
</body>
</html>
